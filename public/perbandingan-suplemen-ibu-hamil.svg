<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 1020" width="722" height="1020" font-family="Poppins, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdeef4"/><stop offset="1" stop-color="#ece8fb"/></linearGradient>
<linearGradient id="pinkc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdd6e5"/><stop offset="1" stop-color="#fbc4d9"/></linearGradient>
<linearGradient id="bluec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3dcf8"/><stop offset="1" stop-color="#c3d0f3"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcd8f7"/><stop offset="1" stop-color="#cfd0f3"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5a4a8a" flood-opacity=".2"/></filter>
<g id="chk"><circle r="12" fill="#fff" stroke="#2f6fd0" stroke-width="2.5"/><path d="M-6 0 l4.5 5 l8 -9.5" fill="none" stroke="#2f6fd0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>
<rect width="722" height="1020" fill="url(#bg)"/>
<text x="361" y="44" text-anchor="middle" font-size="24" font-weight="500" fill="#2b2b33">Perbandingan Supplementasi untuk Ibu Hamil</text>

<!-- TTD card -->
<rect x="24" y="72" width="338" height="646" rx="26" fill="url(#pinkc)" stroke="#dd6c97" stroke-width="3" filter="url(#sh)"/>
<g transform="translate(84,126)"><rect x="-17" y="-26" width="34" height="52" rx="5" fill="#cfe4f3" stroke="#3a4a5c" stroke-width="3"/><circle cx="0" cy="20" r="2" fill="#3a4a5c"/></g>
<rect x="132" y="102" width="130" height="50" rx="25" fill="#f4799f"/>
<text x="197" y="139" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">TTD</text>
<text x="193" y="203" text-anchor="middle" font-size="32" font-weight="700" fill="#d33a74">TTD (Tablet</text>
<text x="193" y="246" text-anchor="middle" font-size="32" font-weight="700" fill="#d33a74">Tambah Darah)</text>
<g transform="translate(62,287) rotate(-40)"><rect x="-13" y="-6.5" width="26" height="13" rx="6.5" fill="#fff" stroke="#3a3a44" stroke-width="2.2"/><path d="M0 -6.5 h6.5 a6.5 6.5 0 0 1 0 13 h-6.5z" fill="#f0527f"/></g>
<text x="86" y="294" font-size="18" font-weight="600" fill="#2b2b33">Fe 60 mg + Folat 400 mcg</text>
<path d="M62 346 V322 M52 332 L62 321 L72 332" fill="none" stroke="#e0426f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="338" font-size="16" font-weight="600" fill="#2b2b33">Minimal 90 tablet, sekarang</text>
<text x="90" y="360" font-size="16" font-weight="600" fill="#2b2b33">180 tablet</text>
<text x="90" y="382" font-size="13" fill="#2b2b33">Ditambah untuk konsumsi lebih lama</text>
<text x="52" y="444" font-size="16" font-weight="700" fill="#2b2b33">KEGUNAAN:</text>
<text x="66" y="476" font-size="16" fill="#2b2b33">• Mencegah &amp; mengatasi anemia</text>
<text x="82" y="500" font-size="16" fill="#2b2b33">pada ibu hamil</text>
<text x="66" y="530" font-size="16" fill="#2b2b33">• Konsumsi minimal 90 hari,</text>
<text x="82" y="554" font-size="16" fill="#2b2b33">dianjurkan 180 hari.</text>
<text x="52" y="590" font-size="16" font-weight="700" fill="#2b2b33">ANJURAN:</text>
<text x="66" y="620" font-size="16" fill="#2b2b33">1 tablet/hari selama kehamilan</text>
<rect x="48" y="654" width="296" height="36" rx="9" fill="#f7a2c0"/>
<text x="64" y="678" font-size="15" font-weight="700" fill="#fff">!</text>
<text x="80" y="678" font-size="12.5" font-weight="600" fill="#fff">Fokus pada zat besi &amp; asam folat saja</text>

<!-- MMS card -->
<rect x="376" y="72" width="322" height="646" rx="26" fill="url(#bluec)" stroke="#3a64b8" stroke-width="3" filter="url(#sh)"/>
<g transform="translate(424,126) rotate(-40)"><rect x="-17" y="-8" width="34" height="16" rx="8" fill="#fff" stroke="#2a3a5c" stroke-width="2.5"/><path d="M0 -8 h9 a8 8 0 0 1 0 16 h-9z" fill="#f6a23a"/><path d="M-9 -8 a8 8 0 0 0 0 16 h9 v-16z" fill="#3a86e0"/></g>
<rect x="468" y="102" width="138" height="50" rx="25" fill="#1f5fae"/>
<text x="537" y="139" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">MMS</text>
<text x="537" y="201" text-anchor="middle" font-size="28" font-weight="700" fill="#1f4f9e">MMS (Multiple</text>
<text x="537" y="238" text-anchor="middle" font-size="20.5" font-weight="700" fill="#1f4f9e">Micronutrient Supplement)</text>
<use href="#chk" x="418" y="287"/><text x="446" y="294" font-size="18" font-weight="700" fill="#2b2b33">15 Mikronutrien</text>
<use href="#chk" x="418" y="331"/><text x="446" y="337" font-size="16.5" font-weight="700" fill="#2b2b33">Fe 27 mg • Folat 600 mcg</text>
<text x="446" y="361" font-size="12.5" fill="#2b2b33">Vit A • B • C • D • E • Zinc • Iodium • dll</text>
<text x="537" y="412" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2b33">MANFAAT LEBIH LENGKAP:</text>
<text x="418" y="440" font-size="15" fill="#2b2b33">• Cegah anemia</text>
<text x="418" y="464" font-size="15" fill="#2b2b33">• Cegah KEK</text>
<text x="434" y="486" font-size="15" fill="#2b2b33">(Kekurangan Energi Kronis)</text>
<text x="418" y="510" font-size="15" fill="#2b2b33">• Cegah BBLR</text>
<text x="434" y="532" font-size="15" fill="#2b2b33">(Berat Badan Lahir Rendah)</text>
<text x="418" y="556" font-size="15" fill="#2b2b33">• Cegah stunting</text>
<text x="398" y="595" font-size="15" font-weight="700" fill="#2b2b33">KEUNGGULAN:</text>
<text x="418" y="621" font-size="15" fill="#2b2b33">• Rasa manis-asam, lebih nyaman</text>
<text x="418" y="645" font-size="15" fill="#2b2b33">• Tidak menyebabkan mual</text>
<text x="398" y="680" font-size="15" font-weight="700" fill="#2b2b33">ANJURAN:</text>
<text x="398" y="704" font-size="14.5" fill="#2b2b33">1 tablet/hari • 180 hari (normal)</text>

<!-- Screening -->
<rect x="24" y="738" width="674" height="270" rx="30" fill="url(#scr)" stroke="#bfbcec" stroke-width="2" filter="url(#sh)"/>
<g transform="translate(184,785)"><rect x="-17" y="-18" width="14" height="40" rx="5" fill="#cfeaf5" stroke="#2a4a6a" stroke-width="2.5"/><rect x="-14" y="2" width="8" height="17" rx="3" fill="#3a9ad8"/><rect x="2" y="-12" width="14" height="34" rx="5" fill="#cfeaf5" stroke="#2a4a6a" stroke-width="2.5" transform="rotate(18 9 5)"/><rect x="5" y="6" width="8" height="14" rx="3" fill="#e0425f" transform="rotate(18 9 5)"/></g>
<text x="214" y="800" font-size="31" font-weight="700" fill="#2b3a8f">SCREENING ANEMIA</text>
<g transform="translate(60,840)"><path d="M-5 -14 h10 v9 h9 v10 h-9 v9 h-10 v-9 h-9 v-10 h9z" fill="#fff" stroke="#2a3a5a" stroke-width="2.5" stroke-linejoin="round"/></g>
<text x="82" y="846" font-size="14.5" fill="#2b2b33">Cek kadar Hb 2x saat kehamilan (<tspan font-weight="700">AWAL</tspan> kehamilan &amp; <tspan font-weight="700">TRIMESTER III</tspan>)</text>
<rect x="44" y="866" width="634" height="126" rx="14" fill="#fdeee4"/>
<path d="M44 880 a14 14 0 0 1 14 -14 H664 a14 14 0 0 1 14 14 V896 H44z" fill="#fcc7a0"/>
<g transform="translate(70,881)"><path d="M0 -12 l13 23 h-26z" fill="#fff" stroke="#2a2a33" stroke-width="2.5" stroke-linejoin="round"/><path d="M0 -4 v8" stroke="#2a2a33" stroke-width="2.5" stroke-linecap="round"/><circle cy="8" r="1.4" fill="#2a2a33"/></g>
<text x="96" y="888" font-size="17" font-weight="700" fill="#2b2b33">CATATAN PENTING:</text>
<text x="76" y="915" font-size="14.5" fill="#2b2b33">• Jangan minum bersamaan — gunakan salah satu: <tspan font-weight="700">TTD ATAU MMS</tspan></text>
<path d="M66 922 a8 8 0 1 0 8 12 a6.5 6.5 0 0 1 -8 -12z" fill="#f6c545" stroke="#2a2a33" stroke-width="2"/>
<text x="92" y="937" font-size="14.5" fill="#2b2b33">Minum malam hari</text>
<g transform="translate(72,956)"><rect x="-9" y="-9" width="9" height="18" rx="1.5" fill="#cfe4f3" stroke="#2a3a5a" stroke-width="2"/><rect x="1" y="-9" width="9" height="18" rx="1.5" fill="#f6a23a" stroke="#2a3a5a" stroke-width="2"/></g>
<text x="92" y="961" font-size="14.5" fill="#2b2b33">Minum dengan air putih atau jus jeruk</text>
<g transform="translate(72,980)"><circle r="8" fill="#fff" stroke="#d33a3a" stroke-width="2.2"/><path d="M-5.5 -5.5 l11 11" stroke="#d33a3a" stroke-width="2.2"/><circle cx="-2" cy="1" r="2" fill="#6a4a3a"/></g>
<text x="92" y="985" font-size="14.5" fill="#2b2b33">Hindari bersamaan dengan teh, kopi, susu</text>
</svg>

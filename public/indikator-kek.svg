<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1422 658" width="1422" height="658" font-family="Poppins, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1f5"/><stop offset="1" stop-color="#fde0ea"/></linearGradient>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f48aa5"/><stop offset="1" stop-color="#d9456f"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3eeff"/><stop offset="1" stop-color="#fde6ee"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6c8cd5" flood-opacity=".25"/></filter>
</defs>
<rect width="1422" height="658" fill="#fff5f8"/>
<rect x="30" y="20" width="1362" height="618" rx="48" fill="url(#bg)" stroke="#e28aa5" stroke-width="3"/>

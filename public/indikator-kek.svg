<circle cx="125" cy="88" r="52" fill="url(#pk)"/>
<path d="M98 88 l20 20 l36 -40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="208" y="118" font-size="78" font-weight="700" fill="#c9446c">Indikator KEK</text>
<!-- divider -->
<line x1="665" y1="195" x2="665" y2="585" stroke="#d9a3b4" stroke-width="3"/>
<!-- LEFT -->
<g transform="translate(0,110)">
<circle cx="125" cy="245" r="62" fill="#fbc9d8"/>
<g transform="translate(125,245)" fill="none" stroke="#c9446c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<ellipse cx="0" cy="-14" rx="34" ry="12"/>
<path d="M-34 -14 v28 c0 7 15 13 34 13 s34 -6 34 -13 v-28"/>
<path d="M34 -14 l22 6 v22 l-22 -2" />
<path d="M-18 -4 v10 M-6 -2 v10 M6 -2 v10 M18 -4 v10" stroke-width="3"/>
</g>
<text x="215" y="230" font-size="54" font-weight="700" fill="#c9446c">LILA &lt; 23,5 cm</text>
<text x="215" y="288" font-size="31" fill="#3a2a3a">Lingkar Lengan Atas</text>
<text x="215" y="330" font-size="31" fill="#3a2a3a">&lt; 23,5 cm</text>
</g>
<!-- RIGHT -->
<circle cx="765" cy="240" r="62" fill="#b9d2f5"/>

</g>
<text x="855" y="250" font-size="62" font-weight="700" fill="#1f4e96">IMT &lt; 18,5 kg/m²</text>
<text x="855" y="312" font-size="31" fill="#3a2a3a">Indeks Massa Tubuh &lt; 18,5 kg/m²</text>
<!-- formula box -->
<rect x="705" y="368" width="640" height="225" rx="30" fill="url(#bl)" stroke="#9db8e6" stroke-width="2.5" filter="url(#sh)"/>
<g transform="translate(742,408)" stroke="#1f4e96" stroke-width="4" fill="#fff" stroke-linejoin="round">
<rect x="0" y="0" width="76" height="110" rx="10"/>
<rect x="10" y="10" width="56" height="20" rx="3" fill="#dfe9fb"/>
<g fill="none"><rect x="10" y="42" width="14" height="14" rx="2"/><rect x="31" y="42" width="14" height="14" rx="2"/><rect x="52" y="42" width="14" height="14" rx="2"/>
<rect x="10" y="64" width="14" height="14" rx="2"/><rect x="31" y="64" width="14" height="14" rx="2"/><rect x="52" y="64" width="14" height="14" rx="2"/>
<rect x="10" y="86" width="14" height="14" rx="2"/><rect x="31" y="86" width="14" height="14" rx="2"/><rect x="52" y="86" width="14" height="14" rx="2"/></g>
</g>
<text x="855" y="440" font-size="40" font-weight="700" fill="#1f4e96">Rumus IMT :</text>
<text x="855" y="515" font-size="60" font-weight="700" fill="#1f4e96">IMT = BB / (TB)²</text>
<text x="1025" y="565" text-anchor="middle" font-size="22" fill="#2b3a55">BB = Berat Badan (kg)  |  TB = Tinggi Badan (meter)</text>
</svg>
